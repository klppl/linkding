name: Build image

# Run manually from the Actions tab. Builds a single-architecture image on a
# native runner (no QEMU emulation) and pushes it to the GitHub Container
# Registry as ghcr.io/<owner>/linkding.
on:
  workflow_dispatch:
    inputs:
      arch:
        description: "CPU architecture of your server (Hetzner CX/CPX/CCX = amd64, CAX = arm64)"
        type: choice
        options:
          - amd64
          - arm64
        default: amd64
      variant:
        description: "plus includes Chromium for HTML snapshots (bigger, slower to build)"
        type: choice
        options:
          - default
          - plus
        default: default

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ inputs.arch }}-${{ inputs.variant }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/linkding"
          suffix=""
          if [ "${{ inputs.variant }}" = "plus" ]; then suffix="-plus"; fi
          {
            echo "TAGS<<EOF"
            echo "${image}:latest${suffix}"
            echo "${image}:$(cat version.txt)${suffix}"
            echo "${image}:sha-${GITHUB_SHA::7}${suffix}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/default.Dockerfile
          target: ${{ inputs.variant == 'plus' && 'linkding-plus' || 'linkding' }}
          platforms: linux/${{ inputs.arch }}
          push: true
          tags: ${{ env.TAGS }}
          # Reuse layers from previous runs, so only changed parts are rebuilt
          cache-from: type=gha,scope=${{ inputs.arch }}-${{ inputs.variant }}
          cache-to: type=gha,mode=max,scope=${{ inputs.arch }}-${{ inputs.variant }}
